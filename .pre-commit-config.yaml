repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2 # same major/minor as the ruff of the environment (pyproject: ruff>=0.15.0)
    hooks:
      # Exécute le linter (erreurs et imports)
      - id: ruff
        args: [ --fix ]
      # Exécute le formateur (espaces et layout)
      - id: ruff-format